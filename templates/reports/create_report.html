{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/pages/reports-create-report.css' %}">{% endblock %}
{% block extra_js %}<script src="{% static 'js/pages/reports-create-report.js' %}"></script>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h3 class="section-title">Submit Waste Report</h3>
    <form method="post" enctype="multipart/form-data" class="mt-3">
      {% csrf_token %}
      {{ form.as_p }}
      <button id="use-location" type="button" class="btn btn-outline-secondary mb-2">Use My Current Location</button>
      <button class="btn btn-success">Submit Report</button>
    </form>
  </div>
</div>
{% endblock %}
