{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/pages/notifications-my-notifications.css' %}">{% endblock %}
{% block content %}
<div class="panel-header">
  <span class="pill-tag mb-2">Alerts</span>
  <h3 class="section-title mb-0">My Notifications</h3>
</div>
<div class="card">
  <div class="card-body p-4">
    <ul class="list-group notify-list">
      {% for n in notifications %}
        <li class="list-group-item d-flex justify-content-between">
          <span>{{ n.message }}</span>
          <small>{{ n.sent_at }}</small>
        </li>
      {% empty %}
        <li class="list-group-item">No notifications yet.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
