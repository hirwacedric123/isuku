{% extends "base.html" %}
{% load static %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/pages/accounts-login.css' %}">{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm auth-card">
      <div class="card-body">
        <h4 class="mb-3 section-title">Login</h4>
        <p class="subtitle-muted">Access your account to manage waste operations.</p>
        <form method="post" class="auth-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success w-100">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
